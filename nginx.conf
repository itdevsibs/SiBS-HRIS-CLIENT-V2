server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed production assets should never fall back to index.html.
    # A stale chunk request must return 404 so lazyWithRetry can reload the
    # latest index.html and resolve the new asset hash.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Do not cache the SPA entry document. It contains the current hashed
    # asset references and must be refreshed after each deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
