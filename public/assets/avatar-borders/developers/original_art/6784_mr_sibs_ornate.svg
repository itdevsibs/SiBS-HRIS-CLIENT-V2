<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc" data-sibs-id="6784">
<title id="title">MR. SIBS — Ornate Avatar Border</title><desc id="desc">Transparent-center, orange-and-gold royal collectible avatar border with a gold crown and MR. SIBS nameplate, designed to match the detailed developer badge collection.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbd2"/><stop offset=".14" stop-color="#ffd05c"/><stop offset=".36" stop-color="#f8a91c"/><stop offset=".56" stop-color="#b56b10"/><stop offset=".77" stop-color="#ffea86"/><stop offset="1" stop-color="#cc7109"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#0f68b8"/><stop offset=".28" stop-color="#062b66"/><stop offset=".55" stop-color="#121e52"/><stop offset=".81" stop-color="#155db2"/><stop offset="1" stop-color="#04142f"/></linearGradient>
  <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc54a"/><stop offset=".18" stop-color="#ff8c16"/><stop offset=".48" stop-color="#e34b02"/><stop offset=".76" stop-color="#a92d00"/><stop offset="1" stop-color="#ffaf28"/></linearGradient>
  <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8c0"/><stop offset=".32" stop-color="#ffdf67"/><stop offset=".62" stop-color="#ea9f10"/><stop offset="1" stop-color="#a45c08"/></linearGradient>
  <radialGradient id="shine"><stop stop-color="#fff"/><stop offset=".25" stop-color="#ffedaa" stop-opacity=".95"/><stop offset="1" stop-color="#ffe0a3" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#200b06" flood-opacity=".48"/></filter>
</defs>
<!-- Halo / royal navy and amber metal rim. The entire interior is transparent. -->
<circle cx="627" cy="636" r="479" fill="none" stroke="#ff910d" stroke-width="25" opacity=".47" filter="url(#glow)"/>
<circle cx="627" cy="636" r="467" fill="none" stroke="#452507" stroke-width="55" filter="url(#shadow)"/>
<circle cx="627" cy="636" r="466" fill="none" stroke="url(#gold)" stroke-width="46"/>
<circle cx="627" cy="636" r="438" fill="none" stroke="url(#navy)" stroke-width="49"/>
<circle cx="627" cy="636" r="413" fill="none" stroke="#ec9a21" stroke-width="9"/>
<circle cx="627" cy="636" r="408" fill="none" stroke="#fff0a4" stroke-width="4" opacity=".9"/>
<circle cx="627" cy="636" r="487" fill="none" stroke="#fff3bb" stroke-width="3" opacity=".9"/>
<!-- Repeating polished studs and golden ornamentation -->
<g>
  <g fill="url(#gold)" stroke="#6c3503" stroke-width="4">
    <circle cx="627" cy="167" r="9"/><circle cx="333" cy="271" r="10"/><circle cx="921" cy="271" r="10"/>
    <circle cx="166" cy="636" r="9"/><circle cx="1088" cy="636" r="9"/>
    <circle cx="333" cy="1001" r="10"/><circle cx="921" cy="1001" r="10"/>
    <circle cx="627" cy="1104" r="9"/>
  </g>
  <g fill="none" stroke="#ffe3a0" stroke-width="4" opacity=".75">
    <path d="M235 416Q300 275 442 208"/><path d="M819 209Q960 272 1020 416"/>
    <path d="M225 842Q283 991 437 1056"/><path d="M817 1056Q972 990 1029 842"/>
  </g>
</g>
<!-- Side floral motifs and jewel crests -->
<g fill="url(#gold)" stroke="#7b430b" stroke-width="5" filter="url(#shadow)">
 <path d="M175 930 C110 895 83 850 101 801 C142 815 174 846 175 930Z"/>
 <path d="M185 942 C118 956 74 934 64 897 C119 876 169 888 185 942Z"/>
 <path d="M182 981 C132 1027 99 1032 70 1008 C110 969 147 957 182 981Z"/>
