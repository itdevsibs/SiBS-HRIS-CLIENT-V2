 <ellipse cx="627" cy="318" rx="30" ry="22" fill="#243b9e" stroke="#fff5c2" stroke-width="8"/>
 <g fill="#fff3b1" stroke="#c07803" stroke-width="6"><circle cx="433" cy="197" r="23"/><circle cx="533" cy="118" r="20"/><circle cx="627" cy="63" r="27"/><circle cx="721" cy="118" r="20"/><circle cx="821" cy="197" r="23"/></g>
 <path d="M627 266L637 287L660 296L637 305L627 328L616 305L595 296L616 287Z" fill="#fff"/>
</g>
<!-- Gold title plate below the portrait (should sit over image, not inside face). -->
<g filter="url(#shadow)">
