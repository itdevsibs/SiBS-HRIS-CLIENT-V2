 <path d="M1072 981 C1122 1027 1155 1032 1184 1008 C1144 969 1107 957 1072 981Z"/>
</g>
<g fill="#ffe3a6" stroke="#d46a00" stroke-width="4"><path d="M164 585L174 610L202 620L174 630L164 657L154 630L126 620L154 610Z"/><path d="M1090 585L1100 610L1128 620L1100 630L1090 657L1080 630L1052 620L1080 610Z"/></g>
