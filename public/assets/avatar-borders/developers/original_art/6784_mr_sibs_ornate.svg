 <path d="M169 1041L211 1008Q627 989 1043 1008L1085 1041L1056 1148Q627 1205 198 1148Z" fill="url(#ruby)" stroke="#ffde75" stroke-width="12"/>
 <path d="M199 1051Q627 1025 1055 1051" fill="none" stroke="#fff6bb" stroke-width="5" opacity=".75"/>
 <text x="627" y="1127" font-family="Arial,DejaVu Sans,sans-serif" font-size="105" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#542304" stroke="#542304" stroke-width="14" paint-order="stroke">MR. SIBS</text>
 <text x="627" y="1127" font-family="Arial,DejaVu Sans,sans-serif" font-size="105" font-weight="900" text-anchor="middle" letter-spacing="2" fill="#fff7c1" stroke="#e28c17" stroke-width="3" paint-order="stroke">MR. SIBS</text>
 <path d="M627 1189L657 1218L627 1244L597 1218Z" fill="#2061b1" stroke="#ffda70" stroke-width="10"/>
</g>
<!-- Jewelled light flares -->
<g opacity=".95"><circle cx="246" cy="325" r="49" fill="url(#shine)"/><circle cx="997" cy="322" r="49" fill="url(#shine)"/><circle cx="110" cy="909" r="39" fill="url(#shine)"/><circle cx="1142" cy="906" r="39" fill="url(#shine)"/><circle cx="627" cy="1001" r="55" fill="url(#shine)"/></g>
</svg>
