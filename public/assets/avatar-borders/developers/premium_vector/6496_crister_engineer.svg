<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="THE ENGINEER avatar border">
<title>THE ENGINEER · SiBS developer avatar</title>
<desc>Premium layered vector avatar overlay with transparent portrait opening; matching collectible border collection. Title text renders separately in HRIS.</desc>
<defs>
 <linearGradient id="ring" x1=".08" y1=".05" x2=".9" y2=".93" gradientUnits="objectBoundingBox"><stop stop-color="#8E9BAC"/><stop offset=".38" stop-color="#495566"/><stop offset="1" stop-color="#202C39"/></linearGradient>
 <linearGradient id="metal" x1=".1" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#F3D296"/><stop offset=".39" stop-color="#DA923E"/><stop offset=".72" stop-color="#DA923E"/><stop offset="1" stop-color="#202C39"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3D296"/><stop offset="1" stop-color="#DA923E"/></linearGradient>
 <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#38388C"/><stop offset=".48" stop-color="#157BC6"/><stop offset="1" stop-color="#00AADE"/></linearGradient>
 <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- Thin perimeter offset shadow and layered ring: the entire center is transparent. -->
<circle cx="256" cy="226" r="177" fill="none" stroke="#202C39" stroke-opacity=".28" stroke-width="34" filter="url(#softShadow)"/>
<circle cx="256" cy="226" r="171.5" fill="none" stroke="#DA923E" stroke-width="32"/>
<circle cx="256" cy="226" r="171.5" fill="none" stroke="url(#ring)" stroke-width="24"/>
<circle cx="256" cy="226" r="186" fill="none" stroke="#DA923E" stroke-width="5"/>
<circle cx="256" cy="226" r="158" fill="none" stroke="#F3D296" stroke-width="5"/>
<circle cx="256" cy="226" r="176" fill="none" stroke="white" stroke-opacity=".46" stroke-width="4" stroke-dasharray="200 910" stroke-linecap="round" transform="rotate(196 256 226)"/>
<circle cx="256" cy="226" r="170" fill="none" stroke="#F3D296" stroke-opacity=".64" stroke-width="3" stroke-dasharray="142 964" stroke-linecap="round" transform="rotate(50 256 226)"/>
<!-- Short inset segmentation marks convey hand-crafted detail without clutter. -->
<g stroke="#F3D296" stroke-width="3" opacity=".85"><path d="M82 155 L98 162 M430 155 L414 162 M88 305 L104 299 M424 305 L408 299"/></g>
<g fill="none" stroke="url(#metal)" stroke-width="7"><circle cx="85" cy="250" r="15"/><circle cx="428" cy="250" r="15"/></g><path d="M76 233 L82 215 M94 268 L102 282 M417 231 L410 213 M438 271 L447 284" stroke="url(#metal)" stroke-width="6"/>
<!-- Main custom medallion with diamond tabs rather than a generic circular icon -->
<g data-avatar-emblem="true" transform="translate(391 80) scale(1.2) translate(-391 -75)">
<path d="M391 13 L441 45 L447 95 L391 130 L338 96 L343 47Z" fill="#202C39" fill-opacity=".28" filter="url(#softShadow)"/>
<path d="M391 15 L442 45 L448 94 L391 132 L338 95 L343 46Z" fill="url(#metal)" stroke="#F3D296" stroke-width="4"/>
<path d="M391 26 L431 51 L435 88 L391 118 L351 89 L354 51Z" fill="url(#ring)" stroke="#F3D296" stroke-opacity=".9" stroke-width="3"/>
<g transform="translate(392 75) scale(.9)"><path d="M-43 5 C-43 -24 -23 -34 -4 -35 C15 -36 34 -23 35 5" fill="url(#metal)" stroke="#FFE7BA" stroke-width="3"/><path d="M-49 7 Q0 0 43 8 L44 20 Q1 27 -49 19Z" fill="#D68936" stroke="#F6D49E" stroke-width="3"/><path d="M-10 -30 V7 M13 -31 V7" stroke="#9C5A2C" stroke-width="5"/><path d="M-7 -39 L3 -39 L14 -28 L10 -13 L-4 -12 L-13 -25Z" fill="#6A7480" stroke="#E7F0F8" stroke-width="3"/><path d="M-6 -31 L4 -21 M4 -31 L-6 -21" stroke="#FFE9C0" stroke-width="3"/><path d="M-33 27 L-22 34 M22 33 L35 29" stroke="#FFF2CE" stroke-width="3.5"/></g>
</g>
<!-- Small corner rivets and diamond base point, no copied crown elements. -->
<g fill="#F3D296" stroke="#202C39" stroke-width="2"><circle cx="74" cy="227" r="5"/><circle cx="439" cy="227" r="5"/></g>
<path d="M239 393 L256 376 L273 393 L256 410Z" fill="url(#metal)" stroke="#F3D296" stroke-width="3"/>
<!-- Bottom plaque is HTML for legibility at 72-78px; no raster or duplicated SVG text. -->
</svg>