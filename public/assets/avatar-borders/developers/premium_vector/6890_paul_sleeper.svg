<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="THE SLEEPER avatar border">
<title>THE SLEEPER · SiBS developer avatar</title>
<desc>Premium layered vector avatar overlay with transparent portrait opening; matching collectible border collection. Title text renders separately in HRIS.</desc>
<defs>
 <linearGradient id="ring" x1=".08" y1=".05" x2=".9" y2=".93" gradientUnits="objectBoundingBox"><stop stop-color="#74BDE9"/><stop offset=".38" stop-color="#246DAD"/><stop offset="1" stop-color="#164170"/></linearGradient>
 <linearGradient id="metal" x1=".1" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#FFF0BF"/><stop offset=".39" stop-color="#E5B963"/><stop offset=".72" stop-color="#E5B963"/><stop offset="1" stop-color="#164170"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FFF0BF"/><stop offset="1" stop-color="#E5B963"/></linearGradient>
 <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#38388C"/><stop offset=".48" stop-color="#157BC6"/><stop offset="1" stop-color="#00AADE"/></linearGradient>
 <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- Thin perimeter offset shadow and layered ring: the entire center is transparent. -->
<circle cx="256" cy="226" r="177" fill="none" stroke="#164170" stroke-opacity=".28" stroke-width="34" filter="url(#softShadow)"/>
<circle cx="256" cy="226" r="171.5" fill="none" stroke="#E5B963" stroke-width="32"/>
<circle cx="256" cy="226" r="171.5" fill="none" stroke="url(#ring)" stroke-width="24"/>
<circle cx="256" cy="226" r="186" fill="none" stroke="#E5B963" stroke-width="5"/>
<circle cx="256" cy="226" r="158" fill="none" stroke="#FFF0BF" stroke-width="5"/>
<circle cx="256" cy="226" r="176" fill="none" stroke="white" stroke-opacity=".46" stroke-width="4" stroke-dasharray="200 910" stroke-linecap="round" transform="rotate(196 256 226)"/>
<circle cx="256" cy="226" r="170" fill="none" stroke="#FFF0BF" stroke-opacity=".64" stroke-width="3" stroke-dasharray="142 964" stroke-linecap="round" transform="rotate(50 256 226)"/>
<!-- Short inset segmentation marks convey hand-crafted detail without clutter. -->
<g stroke="#FFF0BF" stroke-width="3" opacity=".85"><path d="M82 155 L98 162 M430 155 L414 162 M88 305 L104 299 M424 305 L408 299"/></g>
<g fill="url(#metal)"><path d="M83 230 L88 242 L101 246 L88 250 L83 263 L79 250 L65 246 L79 242Z"/><path d="M430 230 L434 242 L447 246 L434 250 L430 263 L426 250 L413 246 L426 242Z"/></g><g fill="#D4EBFA" opacity=".85"><circle cx="117" cy="336" r="13"/><circle cx="136" cy="340" r="10"/><circle cx="396" cy="336" r="13"/><circle cx="377" cy="340" r="10"/></g>
<!-- Main custom medallion with diamond tabs rather than a generic circular icon -->
<g data-avatar-emblem="true" transform="translate(391 80) scale(1.2) translate(-391 -75)">
<path d="M391 13 L441 45 L447 95 L391 130 L338 96 L343 47Z" fill="#164170" fill-opacity=".28" filter="url(#softShadow)"/>
<path d="M391 15 L442 45 L448 94 L391 132 L338 95 L343 46Z" fill="url(#metal)" stroke="#FFF0BF" stroke-width="4"/>
<path d="M391 26 L431 51 L435 88 L391 118 L351 89 L354 51Z" fill="url(#ring)" stroke="#FFF0BF" stroke-opacity=".9" stroke-width="3"/>
<g transform="translate(392 75) scale(.9)"><path d="M-5 -43 A35 35 0 1 0 34 16 A38 38 0 0 1 -5 -43Z" fill="url(#metal)" stroke="#FFF4CB" stroke-width="4"/><g fill="#E9F6FF" stroke="#A0D0F3" stroke-width="2"><circle cx="-13" cy="26" r="17"/><circle cx="9" cy="25" r="21"/><circle cx="28" cy="29" r="13"/><rect x="-23" y="26" width="61" height="18" rx="8"/></g><path d="M18 -28 L21 -20 L29 -18 L21 -15 L18 -7 L15 -15 L7 -18 L15 -20Z" fill="#FFE9A0"/></g>
</g>
<!-- Small corner rivets and diamond base point, no copied crown elements. -->
<g fill="#FFF0BF" stroke="#164170" stroke-width="2"><circle cx="74" cy="227" r="5"/><circle cx="439" cy="227" r="5"/></g>
<path d="M239 393 L256 376 L273 393 L256 410Z" fill="url(#metal)" stroke="#FFF0BF" stroke-width="3"/>
<!-- Bottom plaque is HTML for legibility at 72-78px; no raster or duplicated SVG text. -->
</svg>